# ifup@eth0 runs dhcpcd for eth0, because /etc/network/interfaces has "iface eth0 inet dhcp".
# dhcpcd.service runs the dhcpcd manager, which handles eth0 too. When ifup starts first, eth0 ends
# up with two dhcpcd daemons that share one client ID. The router then NAKs one of them at each
# renewal, and the address changes about every 30 minutes. Started after dhcpcd.service, ifup's
# dhcpcd hands eth0 to the running manager instead.
[Unit]
After=dhcpcd.service
