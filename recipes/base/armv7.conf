[General]
include=VolumioBase.conf
# only pick what we need from VolumioBase
debootstrap=Accessories Assets Base BaseDebPlus Bluetooth FS Firmware Net Utils UPnPArmv7 Volumio BaseArmv7Plus
# debootstrap=UpmpdcliDependencies ShairportSyncDependencies
# Add additional armv7 specific packages (if required)

[BaseArmv7Plus]
packages=libatomic1 fdisk
source=http://deb.debian.org/debian
keyring=debian-archive-keyring
suite=bookworm

[UPnPArmv7]
# upmpdcli comes from CUSTOM_PKGS, these are its runtime deps
packages=libcurl3-gnutls libjsoncpp25 libmicrohttpd12 libmpdclient2 python3-requests
source=http://deb.debian.org/debian
keyring=debian-archive-keyring
suite=bookworm
